  # ---------- VPN 维度（APP-15643，需等版本发版后才有数据） ----------
  # is_vpn 与 network_type 并列上报：走 WiFi 的 VPN 仍然是 wifi，历史曲线不断档，
  # 两个维度可以交叉。布尔按仓库既有口径归一（老版本可能序列化成 1/0）。
  msg_vpn_split:
    params: [date_start, date_end, use_date_end]
    sql: |
      WITH __src AS (
      SELECT
        v.event_date, v.event_name, v.user_id, v.event_id, v.event_timestamp, v.user_pseudo_id,
        k.event_param_key,
        GET_JSON_STRING(v.event_params, CONCAT('$.', k.event_param_key)) AS event_param_value
      FROM ods_original.ods_clickstream_app_event_v2_hi v
      CROSS JOIN (
        SELECT 'result' AS event_param_key
        UNION ALL
        SELECT 'interrupt_reason' AS event_param_key
        UNION ALL
        SELECT 'total_ms' AS event_param_key
        UNION ALL
        SELECT 'first_content_ms' AS event_param_key
        UNION ALL
        SELECT 'is_vpn' AS event_param_key
      ) k
      WHERE v.event_date >= :date_start AND (:use_date_end = 0 OR v.event_date <= :date_end)
        AND v.event_date >= DATE '2026-11-10'
        AND v.event_name = 'chat_stream_result'
        AND GET_JSON_STRING(v.event_params, CONCAT('$.', k.event_param_key)) IS NOT NULL
      UNION ALL
      SELECT
        event_date, event_name, user_id, event_id, event_timestamp, CAST(NULL AS VARCHAR) AS user_pseudo_id,
        event_param_key, event_param_value
      FROM ods_original.ods_clickstream_app_event_parameter_hi
      WHERE event_date >= :date_start AND (:use_date_end = 0 OR event_date <= :date_end)
        AND event_date <= DATE '2026-11-09'
        AND event_param_key IN ('result', 'interrupt_reason', 'total_ms', 'first_content_ms', 'is_vpn')
        AND event_name = 'chat_stream_result'
      ),
      s AS (
        SELECT event_id,
          MAX(CASE WHEN event_param_key = 'result' THEN event_param_value END) AS result,
          MAX(CASE WHEN event_param_key = 'interrupt_reason' THEN event_param_value END) AS interrupt_reason,
          MAX(CASE WHEN event_param_key = 'total_ms' THEN CAST(event_param_value AS DOUBLE) END) AS total_ms,
          MAX(CASE WHEN event_param_key = 'first_content_ms' THEN CAST(event_param_value AS DOUBLE) END) AS first_content_ms,
          MAX(CASE WHEN event_param_key = 'is_vpn' THEN event_param_value END) AS is_vpn
        FROM __src
        WHERE event_name = 'chat_stream_result'
          AND event_param_key IN ('result', 'interrupt_reason', 'total_ms', 'first_content_ms', 'is_vpn')
          AND event_date >= :date_start
          AND (:use_date_end = 0 OR event_date <= :date_end)
          AND crc32(event_id) % 100 = 0
        GROUP BY event_id
      )
      SELECT
        CASE
          WHEN is_vpn IN ('true', '1') THEN 'VPN'
          WHEN is_vpn IN ('false', '0') THEN '直连'
          ELSE '(未发版)'
        END AS vpn_state,
        COUNT(*) * 100 AS est_streams,
        ROUND(COUNT(*) / NULLIF(SUM(COUNT(*)) OVER (), 0), 6) AS share_of_streams,
        ROUND(SUM(CASE WHEN result = 'completed' THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 6) AS completed_rate,
        ROUND(SUM(CASE WHEN result <> 'completed' AND interrupt_reason = 'timeout' THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 6) AS timeout_ratio,
        ROUND(SUM(CASE WHEN result <> 'completed' AND interrupt_reason = 'network' THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 6) AS network_ratio,
        ROUND(SUM(CASE WHEN result <> 'completed' AND interrupt_reason = 'server' THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 6) AS server_ratio,
        ROUND(percentile_approx(CASE WHEN result = 'completed' THEN first_content_ms END, 0.50), 0) AS p50_first_content_ms,
        ROUND(percentile_approx(CASE WHEN result = 'completed' THEN first_content_ms END, 0.90), 0) AS p90_first_content_ms,
        ROUND(percentile_approx(CASE WHEN result = 'completed' THEN total_ms END, 0.90), 0) AS p90_total_ms
      FROM s
      GROUP BY 1
      ORDER BY est_streams DESC
  ws_vpn_split:
    params: [date_start, date_end, use_date_end]
    sql: |
      WITH __v2_base AS (
        SELECT
          event_id, event_date, event_timestamp, user_id, user_pseudo_id, event_name,
          event_params, app_info, device, platform, ingest_timestamp
        FROM ods_original.ods_clickstream_app_event_v2_hi
        WHERE event_date >= :date_start AND (:use_date_end = 0 OR event_date <= :date_end)
          AND event_date >= DATE '2026-11-10'
        AND event_name IN ('ws_connect_attempt', 'ws_connect_success', 'ws_connect_error', 'ws_connect_stalled')
      ),
      __param AS (
        SELECT
          v.event_date, v.event_name, v.user_id, v.event_id, v.event_timestamp, v.user_pseudo_id,
          k.event_param_key,
          GET_JSON_STRING(v.event_params, CONCAT('$.', k.event_param_key)) AS event_param_value,
          v.ingest_timestamp, v.platform, v.app_info, v.device
        FROM __v2_base v
        CROSS JOIN (
          SELECT 'is_vpn' AS event_param_key
        ) k
        WHERE GET_JSON_STRING(v.event_params, CONCAT('$.', k.event_param_key)) IS NOT NULL
        UNION ALL
        SELECT
          event_date, event_name, user_id, event_id, event_timestamp, CAST(NULL AS VARCHAR) AS user_pseudo_id,
          event_param_key, event_param_value,
          ingest_timestamp, CAST(NULL AS VARCHAR) AS platform,
          CAST(NULL AS VARCHAR) AS app_info, CAST(NULL AS VARCHAR) AS device
        FROM ods_original.ods_clickstream_app_event_parameter_hi
        WHERE event_date >= :date_start AND (:use_date_end = 0 OR event_date <= :date_end)
          AND event_date <= DATE '2026-11-09'
          AND event_param_key IN ('is_vpn')
        AND event_name IN ('ws_connect_attempt', 'ws_connect_success', 'ws_connect_error', 'ws_connect_stalled')
      ),
      __evt AS (
        SELECT
          event_id, event_date, event_timestamp, user_id, user_pseudo_id, event_name,
          platform, app_info, device, ingest_timestamp
        FROM __v2_base
        UNION ALL
        SELECT
          event_id, event_date, event_timestamp, user_id, CAST(NULL AS VARCHAR) AS user_pseudo_id, event_name,
          platform, app_info, device, ingest_timestamp
        FROM ods_original.ods_clickstream_app_event_di
        WHERE event_date >= :date_start AND (:use_date_end = 0 OR event_date <= :date_end)
          AND event_date <= DATE '2026-11-09'
        AND event_name IN ('ws_connect_attempt', 'ws_connect_success', 'ws_connect_error', 'ws_connect_stalled')
      ),
      ids AS (
        SELECT event_id, event_name
        FROM __evt
        WHERE event_name IN ('ws_connect_attempt', 'ws_connect_success', 'ws_connect_error', 'ws_connect_stalled')
          AND platform = 'Android'
          AND get_json_string(app_info, '$.id') = 'com.flow.mobile'
          AND event_date >= :date_start
          AND (:use_date_end = 0 OR event_date <= :date_end)
      ),
      p AS (
        SELECT pa.event_id,
          MAX(CASE WHEN pa.event_param_key = 'is_vpn' THEN pa.event_param_value END) AS is_vpn
        FROM __param pa
        WHERE pa.event_name IN ('ws_connect_attempt', 'ws_connect_success', 'ws_connect_error', 'ws_connect_stalled')
          AND pa.event_param_key = 'is_vpn'
          AND pa.event_date >= :date_start
          AND (:use_date_end = 0 OR pa.event_date <= :date_end)
        GROUP BY pa.event_id
      ),
      joined AS (
        SELECT ids.event_name, p.is_vpn
        FROM p JOIN ids ON ids.event_id = p.event_id
      )
      SELECT
        CASE
          WHEN is_vpn IN ('true', '1') THEN 'VPN'
          WHEN is_vpn IN ('false', '0') THEN '直连'
          ELSE '(未发版)'
        END AS vpn_state,
        SUM(CASE WHEN event_name = 'ws_connect_attempt' THEN 1 ELSE 0 END) AS attempts,
        SUM(CASE WHEN event_name = 'ws_connect_success' THEN 1 ELSE 0 END) AS successes,
        SUM(CASE WHEN event_name = 'ws_connect_error' THEN 1 ELSE 0 END) AS errors,
        SUM(CASE WHEN event_name = 'ws_connect_stalled' THEN 1 ELSE 0 END) AS stalled,
        ROUND(SUM(CASE WHEN event_name = 'ws_connect_success' THEN 1 ELSE 0 END)
              / NULLIF(SUM(CASE WHEN event_name = 'ws_connect_attempt' THEN 1 ELSE 0 END), 0), 6) AS connect_success_rate,
        ROUND(SUM(CASE WHEN event_name = 'ws_connect_error' THEN 1 ELSE 0 END)
              / NULLIF(SUM(CASE WHEN event_name = 'ws_connect_attempt' THEN 1 ELSE 0 END), 0), 6) AS error_rate
      FROM joined
      GROUP BY 1
      ORDER BY attempts DESC

  # ---------- ANR 归因（保留完整 longMsg 分片，默认最近两个完整日期） ----------
  anr_payload:
    params: [date_start, date_end, use_date_end]
    sql: |
      WITH __src AS (
      SELECT
        v.event_date, v.event_name, v.user_id, v.event_id, v.event_timestamp, v.user_pseudo_id,
        k.event_param_key,
        GET_JSON_STRING(v.event_params, CONCAT('$.', k.event_param_key)) AS event_param_value
      FROM ods_original.ods_clickstream_app_event_v2_hi v
      CROSS JOIN (
        SELECT 'anr_status' AS event_param_key
        UNION ALL
        SELECT 'device_ram_mb' AS event_param_key
      ) k
      WHERE v.event_date >= :date_start AND (:use_date_end = 0 OR v.event_date <= :date_end)
        AND v.event_date >= DATE '2026-11-10'
        AND v.event_name = 'app_crash'
        AND GET_JSON_STRING(v.event_params, CONCAT('$.', k.event_param_key)) IS NOT NULL
      UNION ALL
      SELECT
        event_date, event_name, user_id, event_id, event_timestamp, CAST(NULL AS VARCHAR) AS user_pseudo_id,
        event_param_key, event_param_value
      FROM ods_original.ods_clickstream_app_event_parameter_hi
      WHERE event_date >= :date_start AND (:use_date_end = 0 OR event_date <= :date_end)
        AND event_date <= DATE '2026-11-09'
        AND event_param_key IN ('anr_status', 'device_ram_mb')
        AND event_name = 'app_crash'
      ),
      anr_ids AS (
        SELECT p.event_date, p.event_id
        FROM __src p
        WHERE p.event_date >= :date_start
          AND (:use_date_end = 0 OR p.event_date <= :date_end)
          AND p.event_name = 'app_crash'
          AND p.event_param_key = 'anr_status'
          AND p.event_param_value IN ('captured', 'missing_main_stack')
        GROUP BY p.event_date, p.event_id
      )
      SELECT p.event_date, p.event_id, p.event_timestamp,
        p.event_param_key, p.event_param_value
      FROM __src p
      JOIN anr_ids a ON a.event_date = p.event_date AND a.event_id = p.event_id
      WHERE p.event_date >= :date_start
        AND (:use_date_end = 0 OR p.event_date <= :date_end)
        AND p.event_name = 'app_crash'
        AND (p.event_param_key IN ('anr_status', 'device_ram_mb')
             OR p.event_param_key LIKE 'anr_data_v1_%')
  anr_details:
    params: [date_start, date_end, use_date_end]
    sql: |
      WITH __v2_base AS (
        SELECT
          event_id, event_date, event_timestamp, user_id, user_pseudo_id, event_name,
          event_params, app_info, device, platform, ingest_timestamp
        FROM ods_original.ods_clickstream_app_event_v2_hi
        WHERE event_date >= :date_start AND (:use_date_end = 0 OR event_date <= :date_end)
          AND event_date >= DATE '2026-11-10'
        AND event_name = 'app_crash'
      ),
      __param AS (
        SELECT
          v.event_date, v.event_name, v.user_id, v.event_id, v.event_timestamp, v.user_pseudo_id,
          k.event_param_key,
          GET_JSON_STRING(v.event_params, CONCAT('$.', k.event_param_key)) AS event_param_value,
          v.ingest_timestamp, v.platform, v.app_info, v.device
        FROM __v2_base v
        CROSS JOIN (
          SELECT 'anr_status' AS event_param_key
        ) k
        WHERE GET_JSON_STRING(v.event_params, CONCAT('$.', k.event_param_key)) IS NOT NULL
        UNION ALL
        SELECT
          event_date, event_name, user_id, event_id, event_timestamp, CAST(NULL AS VARCHAR) AS user_pseudo_id,
          event_param_key, event_param_value,
          ingest_timestamp, CAST(NULL AS VARCHAR) AS platform,
          CAST(NULL AS VARCHAR) AS app_info, CAST(NULL AS VARCHAR) AS device
        FROM ods_original.ods_clickstream_app_event_parameter_hi
        WHERE event_date >= :date_start AND (:use_date_end = 0 OR event_date <= :date_end)
          AND event_date <= DATE '2026-11-09'
          AND event_param_key IN ('anr_status')
        AND event_name = 'app_crash'
      ),
      __evt AS (
        SELECT
          event_id, event_date, event_timestamp, user_id, user_pseudo_id, event_name,
          platform, app_info, device, ingest_timestamp
        FROM __v2_base
        UNION ALL
        SELECT
          event_id, event_date, event_timestamp, user_id, CAST(NULL AS VARCHAR) AS user_pseudo_id, event_name,
          platform, app_info, device, ingest_timestamp
        FROM ods_original.ods_clickstream_app_event_di
        WHERE event_date >= :date_start AND (:use_date_end = 0 OR event_date <= :date_end)
          AND event_date <= DATE '2026-11-09'
        AND event_name = 'app_crash'
      ),
      anr_ids AS (
        SELECT p.event_date, p.event_id
        FROM __param p
        WHERE p.event_date >= :date_start
          AND (:use_date_end = 0 OR p.event_date <= :date_end)
          AND p.event_name = 'app_crash'
          AND p.event_param_key = 'anr_status'
          AND p.event_param_value IN ('captured', 'missing_main_stack')
        GROUP BY p.event_date, p.event_id
      )
      SELECT a.event_date, a.event_id, d.event_timestamp,
        CAST(d.app_info AS STRING) AS app_info_json,
        CAST(d.device AS STRING) AS device_json, d.platform
      FROM anr_ids a
      LEFT JOIN __evt d
        ON d.event_date = a.event_date AND d.event_id = a.event_id
        AND d.event_name = 'app_crash' AND d.platform = 'Android'
      WHERE a.event_date >= :date_start
        AND (:use_date_end = 0 OR a.event_date <= :date_end)
  anr_summary:
    cache_ttl: 900
    params: [date_start, date_end, use_date_end, snapshot_etl]
    sql: |
      WITH source_rows AS (
          SELECT
              v.event_date,
              v.hr,
              v.event_id,
              v.event_timestamp,
              v.ingest_timestamp,
              v.etl_time,
              v.app_info,
              v.device,
              v.event_params,
              MD5(CONCAT(
                  COALESCE(CAST(v.event_params AS STRING), ''), '|',
                  COALESCE(CAST(v.app_info AS STRING), ''), '|',
                  COALESCE(CAST(v.device AS STRING), '')
              )) AS record_fingerprint
          FROM ods_original.ods_clickstream_app_event_v2_hi v
          WHERE v.event_date >= CAST(:date_start AS DATE)
            AND v.event_date <= CAST(:date_end AS DATE)
            AND v.event_date >= DATE '2026-11-10'
            AND :use_date_end IN (0, 1)
            AND v.event_name = 'app_crash'
            AND v.platform = 'Android'
            AND GET_JSON_STRING(v.app_info, '$.id') = 'com.flow.mobile'
            AND GET_JSON_STRING(v.app_info, '$.app_id') = 'flowgpt_app'
            AND COALESCE(v.event_id, '') <> ''
            AND COALESCE(v.etl_time, CAST('1970-01-01 00:00:00' AS DATETIME))
                <= CAST(:snapshot_etl AS DATETIME)
      ), ranked AS (
          SELECT
              s.*,
              ROW_NUMBER() OVER (
                  PARTITION BY s.event_id
                  ORDER BY s.ingest_timestamp DESC, s.etl_time DESC,
                           s.event_timestamp DESC, s.event_date DESC, s.hr DESC,
                           s.record_fingerprint DESC
              ) AS event_rank
          FROM source_rows s
      ), anr_events AS (
          SELECT
              r.*,
              GET_JSON_STRING(r.app_info, '$.version') AS app_version,
              GET_JSON_STRING(r.event_params, '$.anr_status') AS anr_status,
              GET_JSON_STRING(r.event_params, '$.anr_type') AS anr_type,
              GET_JSON_STRING(r.event_params, '$.anr_probe_v1') AS probe_json,
              CAST(GET_JSON_STRING(r.event_params, '$.device_ram_mb') AS DOUBLE) AS device_ram_mb,
              CASE
                  WHEN COALESCE(GET_JSON_STRING(r.event_params, '$.anr_data_v1_000'), '') <> ''
                  THEN 1 ELSE 0
              END AS has_chunk0,
              CASE
                  WHEN GET_JSON_STRING(r.event_params, '$.anr_status')
                           IN ('captured', 'missing_main_stack') THEN 'canonical'
                  WHEN GET_JSON_STRING(r.event_params, '$.anr_status')
                           = 'same_process_unmatched' THEN 'candidate'
                  ELSE 'other'
              END AS record_kind
          FROM ranked r
          WHERE r.event_rank = 1
            AND r.event_timestamp > 0
            AND GET_JSON_STRING(r.event_params, '$.exit_reason') = 'anr'
      )
      SELECT
          COUNT(*) AS anr_total,
          COALESCE(SUM(CASE WHEN a.record_kind = 'canonical' THEN 1 ELSE 0 END), 0) AS canonical_status_count,
          COALESCE(SUM(CASE WHEN a.record_kind = 'canonical' AND a.has_chunk0 = 1 THEN 1 ELSE 0 END), 0) AS canonical_with_chunk0,
          COALESCE(SUM(CASE WHEN a.record_kind = 'candidate' THEN 1 ELSE 0 END), 0) AS candidate_status_count,
          COALESCE(SUM(CASE WHEN a.record_kind = 'candidate' AND a.has_chunk0 = 1 THEN 1 ELSE 0 END), 0) AS candidate_with_chunk0,
          COALESCE(SUM(CASE WHEN a.record_kind = 'canonical' AND a.has_chunk0 = 0 THEN 1 ELSE 0 END), 0) AS canonical_missing_chunk0,
          COALESCE(SUM(CASE WHEN a.record_kind = 'candidate' AND a.has_chunk0 = 0 THEN 1 ELSE 0 END), 0) AS candidate_missing_chunk0,
          COALESCE(SUM(CASE WHEN COALESCE(a.anr_status, '') = '' THEN 1 ELSE 0 END), 0) AS no_diagnostic_status_count,
          COALESCE(SUM(CASE WHEN a.anr_status = 'missing_longmsg' THEN 1 ELSE 0 END), 0) AS missing_longmsg_count,
          COALESCE(SUM(CASE WHEN a.anr_status = 'missing' THEN 1 ELSE 0 END), 0) AS missing_count,
          COALESCE(SUM(CASE WHEN COALESCE(a.anr_status, '') <> ''
              AND a.anr_status NOT IN ('captured', 'missing_main_stack', 'same_process_unmatched', 'missing_longmsg', 'missing')
              THEN 1 ELSE 0 END), 0) AS other_status_count,
          COALESCE(SUM(CASE WHEN a.etl_time IS NULL THEN 1 ELSE 0 END), 0) AS missing_etl_count,
          DATE_FORMAT(COALESCE(MAX(a.etl_time), CURRENT_TIMESTAMP()), '%Y-%m-%d %H:%i:%s') AS snapshot_etl,
          MAX(a.ingest_timestamp) AS max_ingest_timestamp,
          MAX(a.event_timestamp) AS max_event_timestamp,
          CASE WHEN CAST(:date_start AS DATE) < DATE '2026-11-10' THEN 1 ELSE 0 END AS legacy_range_unsupported
      FROM anr_events a
  anr_page:
    cache_ttl: 300
    params: [date_start, date_end, use_date_end, snapshot_etl, record_kind, cursor_event_timestamp, cursor_event_id]
    sql: |
      WITH source_rows AS (
          SELECT
              v.event_date,
              v.hr,
              v.event_id,
              v.event_timestamp,
              v.ingest_timestamp,
              v.etl_time,
